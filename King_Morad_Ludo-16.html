<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>লুডু</title>
<style>
:root{--fg:#fff;--gold:#ffc72c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;color:var(--fg);text-align:center;font-family:'Noto Sans Bengali','Hind Siliguri',system-ui,sans-serif;background:radial-gradient(circle,#0a2d6340 7px,transparent 8px) 0 0/44px 44px,repeating-linear-gradient(45deg,#ffffff12 0 22px,#00000014 22px 44px),radial-gradient(ellipse at 50% 35%,#3a8be8 0,#1b5fb8 55%,#0b3170 100%)}
:root{--W:min(98vw,58vh)}#g{padding-bottom:48px}
[hidden]{display:none!important}
#k.pg{position:fixed;left:10px;top:120px;width:250px;box-sizing:border-box;z-index:10;padding:8px;background:#10305f;border:2px solid #ffc72c;border-radius:14px;box-shadow:0 4px 16px #000a;touch-action:none}#k.pg .big button{width:64px;height:54px;font-size:26px;margin:3px;padding:0}#k.pg h1{font-size:18px;margin:0 0 4px}#k.pg p{margin:2px;font-size:13px}#k.pg small{display:none}#k.pg button{font-size:15px;padding:8px 10px;margin:3px}#kx{display:none}#k.pg #kg{display:none}#k.pg #kx{display:inline-block}#gear{position:fixed;left:8px;bottom:calc(2px + env(safe-area-inset-bottom,0px));width:38px;height:38px;border-radius:50%;border:0;background:#0b2a5a;color:#fff;font-size:20px;opacity:.25;z-index:5}#sx button{width:46px;height:42px;margin:3px;border-radius:10px;border:1.5px solid #fff;background:#0b2a5a;color:#fff;font-size:18px}#sx button.on{background:#139c43;opacity:1}
h1{margin:8px 0 0;font-size:30px;color:#fff;text-shadow:0 1px 3px #000}
#st{margin:2px 0;font-weight:700;min-height:24px;text-shadow:0 1px 3px #000}
.r{display:flex;justify-content:space-between;width:var(--W);margin:10px auto;height:calc(var(--W)*.165)}
.r i{display:flex;width:calc(var(--W)*.33);height:100%;box-sizing:border-box;border-radius:10px;border:3px solid #f0b400;background:linear-gradient(90deg,#0a3f9e,#2f78de);overflow:hidden;font-style:normal}
.r i{position:relative}.cnt{position:absolute;top:1px;left:6px;font-size:11px;font-style:normal;color:#fff;background:#0009;border-radius:8px;padding:0 5px}
.pn{flex:1;display:flex;align-items:center;justify-content:center}.pn svg{height:80%;width:auto}
.dc{flex:1.2;margin:3px;border-radius:8px;background:#f1c6c6;border:2px solid #cfa3a3;display:flex;align-items:center;justify-content:center}
.df{width:80%;aspect-ratio:1;background:linear-gradient(#fff,#cfd5db);border-radius:14%;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:10%;box-sizing:border-box;box-shadow:0 1px 3px #0008}
.df u{margin:14%;border-radius:50%}.df u.o{background:radial-gradient(#555,#000)}
.r i.cur{cursor:pointer;box-shadow:0 0 14px 4px #ffc72c;animation:g 1s infinite alternate}
@keyframes g{to{box-shadow:0 0 4px 1px #ffc72c}}
.cu{position:relative;width:100%;height:100%;transform-style:preserve-3d;animation:tb .95s ease-in-out forwards}.cf{position:absolute;inset:0}.cf .df{width:100%;height:100%;border-radius:16%}
@keyframes tb{0%{transform:translate(0,0) scale(1) rotateX(0) rotateY(0) rotateZ(0)}35%{transform:translate(-5px,-30px) scale(1.45) rotateX(300deg) rotateY(200deg) rotateZ(80deg)}70%{transform:translate(4px,-14px) scale(1.2) rotateX(560deg) rotateY(420deg) rotateZ(200deg)}100%{transform:translate(0,0) scale(1) rotateX(720deg) rotateY(720deg) rotateZ(360deg)}}
@keyframes bob{to{transform:translateX(8px)}}
.y{transition:filter .3s}.y.act{filter:brightness(1.18) saturate(1.15)}
#b{position:relative;width:var(--W);aspect-ratio:1;margin:0 auto;display:grid;grid-template:repeat(15,1fr)/repeat(15,1fr);border:3px solid #0b2a5a;background:#fff;box-shadow:0 4px 16px #000a}
.c{border:.5px solid #aaa;display:flex;align-items:center;justify-content:center;font-size:5vw;color:#888;background:#fff}
.n{border:0;background:transparent}
.y{position:absolute;width:40%;height:40%;z-index:1;box-shadow:inset 0 0 0 2px #0002,inset 0 -8px 14px #0003,inset 0 8px 12px #fff3}
.y::after{content:"";position:absolute;inset:16.6%;background:#fff;border-radius:3%;box-shadow:inset 0 3px 10px #0005}
.dot{box-shadow:inset 0 -4px 6px #0003,inset 0 4px 6px #fff4;position:absolute;width:11%;height:11%;border-radius:50%;z-index:2;transform:translate(-50%,-50%)}
#ct{box-shadow:inset 0 0 14px #0005;position:absolute;left:40%;top:40%;width:20%;height:20%;z-index:1;background:conic-gradient(from -45deg,#fbd400 0 25%,#29abe2 0 50%,#e31c1c 0 75%,#1fa84a 0)}
.t{position:absolute;width:7.2%;aspect-ratio:40/56;transform:translate(-50%,-79%);transition:left .15s linear,top .15s linear;will-change:left,top;z-index:3}
.t svg{display:block}
.t.ok{animation:p .7s ease-in-out infinite;cursor:pointer;z-index:4}
@keyframes p{0%,100%{transform:translate(-50%,-79%)}50%{transform:translate(-50%,-91%)}}
.t.hop{animation:h .15s ease-out}.t.dead{animation:k .6s ease-in}@keyframes k{to{transform:translate(-50%,-79%) rotate(540deg) scale(.5)}}@keyframes h{50%{transform:translate(-50%,-88%) scale(1.03)}}
.y span{position:absolute;left:0;right:0;font-weight:700;font-size:4.4vw;color:#fff;z-index:2;text-shadow:0 1px 2px #0008}

#mute,#rst{position:fixed;bottom:calc(2px + env(safe-area-inset-bottom,0px));width:38px;height:38px;border-radius:50%;border:0;background:#0b2a5a;color:#fff;font-size:18px;opacity:.35;z-index:5}#mute{left:52px}#rst{left:96px}
#px,#py,#pa,#px~br,#px+br+button,#px+br+button+button{display:none!important}
.ov{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;z-index:9}
.ov div{background:#10305f;padding:22px;border-radius:16px;border:2px solid var(--gold);width:min(86vw,360px)}
.ov button,.k button{font:inherit;font-size:18px;margin:6px;padding:12px 20px;border-radius:12px;border:2px solid #fff;background:linear-gradient(#ffd24d,#e59a00);color:#3a2400;font-weight:700;cursor:pointer}
.k{padding:16px}.k .big button{width:84px;height:84px;font-size:38px}
.k button.on{background:linear-gradient(#5cf08b,#139c43);color:#fff}
#sp{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 30%,#1d5fc0,#0a2d63);transition:opacity .5s}#sp img{max-width:100%;max-height:calc(100% - 96px);object-fit:contain}#sp.out{opacity:0;pointer-events:none}
#sp button{position:absolute;bottom:calc(24px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);font:inherit;font-size:22px;font-weight:700;padding:12px 44px;border-radius:28px;border:2px solid #fff;background:linear-gradient(#ffd24d,#e59a00);color:#3a2400;box-shadow:0 4px 14px #0008;cursor:pointer}
</style></head><body>
